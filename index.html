<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Calculator</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Simple Calculator</h1>
            <div class="card2">
                <h4>First Number</h4>
                <input type="number" name="numbers1" id="number1">
                <select name="operators" id="operator">
                    <option value="add">Addition(+)</option>
                    <option value="sub">Subtraction(-)</option>
                    <option value="mul">Multiplication(*)</option>
                    <option value="divid">Division(÷)</option>
                </select>
                <h4>Second Number</h4>
                <input type="number" name="numbers2" id="number2">
                <button id="button">Calculator</button>
                <strong>Result<span id="res">0</span></strong>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
